name: CD typescript-fetch

# Monorepo client: clients/typescript-fetch (@nemtus/symbol-rest-api-client-fetch).
on:
  # Automated release: pushing a `typescript-fetch-vX.Y.Z` tag triggers the pipeline. The tag is
  # created by `npm run release:*` in clients/typescript-fetch -> scripts/release.mjs,
  # which owns the tag name (`npm version` cannot tag from a monorepo subdirectory,
  # so no `tag-version-prefix` is set in that client's .npmrc). The `publish` job
  # still waits on the `npm-production` Environment approval gate before anything is
  # published, and the `release` job then opens a GitHub Release for the same tag.
  push:
    tags:
      - 'typescript-fetch-v*'
  # Manual fallback.
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: clients/typescript-fetch

# Serialize the whole publish pipeline: only one CD run at a time for THIS client,
# across BOTH tag pushes and manual dispatches. A ref-based group would NOT cover that
# race — a tag push (refs/tags/typescript-fetch-v*) and a workflow_dispatch
# (refs/heads/*) have different refs — so group on the workflow itself (one file per
# client). Never cancel an in-flight publish.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# `npm ci` installs the lockfile-pinned versions regardless of age, so the local
# .npmrc cooldown (min-release-age) does not gate it — every install is instead gated
# by `npm audit`. The remaining cooldown only affects the global `npm install -g`
# tooling here, which we deliberately leave subject to it.
env:
  # `npm ci` wipes node_modules, so cache npm's download directory instead. Point it at a
  # workspace-local path that is writable in every job (including the browser-cdn container).
  NPM_CONFIG_CACHE: ${{ github.workspace }}/.npm

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java-version: [21]
        node-version: [26.x]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          distribution: 'microsoft'
          java-version: ${{ matrix.java-version }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://registry.npmjs.org'
      - run: java -version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-root
        with:
          path: ${{ github.workspace }}/.npm
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-fetch-root-${{ hashFiles('clients/typescript-fetch/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-fetch-root-
      - run: npm audit --package-lock-only
      # Socket Firewall Free (`sfw`): blocks confirmed-malicious packages (incl. transitive
      # deps) before npm fetches them — coverage `npm audit` (known CVEs only) lacks.
      # `firewall-free` mode needs no Socket account/token. Wrapped around EVERY `npm ci`
      # in this workflow (it mirrors CI), so the publish pipeline cannot install untrusted
      # code at any stage. Pinned to a full SHA per the repo's pinact policy.
      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
      - run: sfw npm ci
      # Use the lockfile-pinned generator (a devDependency), not an unpinned global
      # `npm install -g @latest`. npx resolves to the local node_modules copy, so the
      # version is reproducible, audited (it's in the lockfile), and bumped via Dependabot.
      - run: npx @openapitools/openapi-generator-cli version
      - run: npm run openapi:set:version
      - run: npm run openapi:generate
      - run: npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-fetch-${{ github.run_id }}-${{ github.run_attempt }}
          path: clients/typescript-fetch/dist/
          retention-days: 1

  test-unit:
    needs: build
    runs-on: ubuntu-latest
    # The ONLY multi-Node job. `engines.node` in this client's package.json declares
    # `>=22`, so this runs the deterministic unit suite on every Node line that claim
    # covers: 22.x and 24.x (Maintenance LTS) and 26.x (Active LTS). Without it the floor
    # would be asserted but never exercised. Everything else — build, the live-node
    # suites, publish — runs on 26.x alone, since one runtime is enough to produce and
    # validate the artifact. This is also why the `dist-*` artifact name does NOT include
    # the node version: `build` publishes one artifact on 26.x that all three lanes here
    # download. No `fail-fast: false` here (unlike CI): on a release, any failing lane
    # should stop the run rather than keep burning minutes before `publish` is blocked.

    strategy:
      matrix:
        java-version: [21]
        node-version: [22.x, 24.x, 26.x]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-fetch-${{ github.run_id }}-${{ github.run_attempt }}
          path: clients/typescript-fetch/dist/
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-root-test
        with:
          path: ${{ github.workspace }}/.npm
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-fetch-root-${{ hashFiles('clients/typescript-fetch/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-fetch-root-
      - run: npm audit --package-lock-only
      # Block malicious installs (Socket Firewall Free) — see the build job for rationale.
      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
      - run: sfw npm ci
      - run: npm run test

  test-nodejs-javascript:
    needs: build
    runs-on: ubuntu-latest
    # Hits a live mainnet node. This integration suite is expected to pass, so it gates
    # the run (no continue-on-error). If the public node is transiently unavailable,
    # re-run the job rather than ignoring the failure.

    strategy:
      matrix:
        java-version: [21]
        node-version: [26.x]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-fetch-${{ github.run_id }}-${{ github.run_attempt }}
          path: clients/typescript-fetch/dist/
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-nodejs-javascript
        with:
          path: ${{ github.workspace }}/.npm
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-fetch-nodejs-javascript-${{ hashFiles('clients/typescript-fetch/tests/nodejs-javascript/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-fetch-nodejs-javascript-
      - run: npm audit --package-lock-only
        working-directory: clients/typescript-fetch/tests/nodejs-javascript
      # Block malicious installs (Socket Firewall Free) — see the build job for rationale.
      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
      - run: sfw npm ci
        working-directory: clients/typescript-fetch/tests/nodejs-javascript
      - run: npm test
        working-directory: clients/typescript-fetch/tests/nodejs-javascript

  test-nodejs-typescript:
    needs: build
    runs-on: ubuntu-latest
    # Hits a live mainnet node. This integration suite is expected to pass, so it gates
    # the run (no continue-on-error). If the public node is transiently unavailable,
    # re-run the job rather than ignoring the failure.

    strategy:
      matrix:
        java-version: [21]
        node-version: [26.x]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-fetch-${{ github.run_id }}-${{ github.run_attempt }}
          path: clients/typescript-fetch/dist/
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-nodejs-typescript
        with:
          path: ${{ github.workspace }}/.npm
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-fetch-nodejs-typescript-${{ hashFiles('clients/typescript-fetch/tests/nodejs-typescript/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-fetch-nodejs-typescript-
      - run: npm audit --package-lock-only
        working-directory: clients/typescript-fetch/tests/nodejs-typescript
      # Block malicious installs (Socket Firewall Free) — see the build job for rationale.
      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
      - run: sfw npm ci
        working-directory: clients/typescript-fetch/tests/nodejs-typescript
      - run: npm test
        working-directory: clients/typescript-fetch/tests/nodejs-typescript

  # Derive the Playwright container tag from the locked `playwright` version in
  # tests/browser-cdn so the image always matches the npm package.
  detect-playwright-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pw.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - id: pw
        run: |
          version="$(node -p "require('./tests/browser-cdn/package-lock.json').packages['node_modules/playwright']?.version ?? ''")"
          if [ -z "${version}" ]; then
            echo "::error::Could not read playwright version from clients/typescript-fetch/tests/browser-cdn/package-lock.json (packages['node_modules/playwright'].version) — the lockfile path or structure may have changed." >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  test-browser-cdn:
    needs: [build, detect-playwright-version]
    runs-on: ubuntu-latest
    # Hits a live mainnet node. This integration suite is expected to pass, so it gates
    # the run (no continue-on-error). If the public node is transiently unavailable,
    # re-run the job rather than ignoring the failure.
    container:
      # Auto-synced to the locked playwright version by detect-playwright-version.
      image: mcr.microsoft.com/playwright:v${{ needs.detect-playwright-version.outputs.version }}-noble
      options: --user 1001

    strategy:
      matrix:
        java-version: [21]
        node-version: [26.x]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-fetch-${{ github.run_id }}-${{ github.run_attempt }}
          path: clients/typescript-fetch/dist/
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-browser-cdn
        with:
          path: ${{ github.workspace }}/.npm
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-fetch-browser-cdn-${{ hashFiles('clients/typescript-fetch/tests/browser-cdn/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-fetch-browser-cdn-
      - run: npm audit --package-lock-only
        working-directory: clients/typescript-fetch/tests/browser-cdn
      # Block malicious installs (Socket Firewall Free) — see the build job for rationale.
      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
      - run: sfw npm ci
        working-directory: clients/typescript-fetch/tests/browser-cdn
      - run: npm run test
        working-directory: clients/typescript-fetch/tests/browser-cdn

  publish:
    needs: [test-unit, test-nodejs-javascript, test-nodejs-typescript, test-browser-cdn]
    runs-on: ubuntu-latest
    # Manual approval gate: configure the `npm-production` environment with required reviewers
    # in GitHub repo settings. Also set this same environment name in the npm Trusted
    # Publisher config so only runs that passed this gate can publish.
    environment: npm-production
    permissions:
      contents: read
      id-token: write # Required for npm Trusted Publishing (OIDC). No NPM_TOKEN needed.

    strategy:
      matrix:
        java-version: [21]
        node-version: [26.x]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-fetch-${{ github.run_id }}-${{ github.run_attempt }}
          path: clients/typescript-fetch/dist/
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-root-publish
        with:
          path: ${{ github.workspace }}/.npm
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-fetch-root-${{ hashFiles('clients/typescript-fetch/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-fetch-root-
      - run: npm audit --package-lock-only
      # Firewall the install in the PRIVILEGED publish job too: this job holds
      # `id-token: write`, so a malicious dep fetched here is the worst case (it could
      # tamper with ./dist or abuse the OIDC publish credential). `sfw` blocks confirmed
      # malware before npm fetches it. Unlike the deliberately-avoided unpinned
      # `npm install -g npm@latest` below, SocketDev/action is SHA-pinned, so it fits the
      # repo's "no unpinned code in the id-token step" rule.
      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
      - run: sfw npm ci
      # Trusted Publishing (OIDC) requires npm >= 11.5.1, which ships by default with
      # Node.js 26.x (26.13.0 bundles npm 11.20.0) — so we do NOT
      # `npm install -g npm@latest` (that would add a fresh, unpinned global package to
      # the privileged id-token step). Just assert the bundled npm meets the minimum and
      # fail fast otherwise.
      - run: |
          npm --version
          printf '11.5.1\n%s\n' "$(npm -v)" | sort -V -C \
            || { echo "npm $(npm -v) < 11.5.1 (required for OIDC Trusted Publishing)"; exit 1; }
      # No NODE_AUTH_TOKEN: npm exchanges the GitHub OIDC token for a short-lived
      # publish credential. --provenance attaches a verifiable build provenance attestation.
      - run: npm publish --access=public --provenance
        working-directory: clients/typescript-fetch/dist

  # Record-keeping GitHub Release for the version just published to npm, with
  # auto-generated notes (the same content as the web "Generate release notes" button)
  # scoped to the previous release OF THIS CLIENT. Mirrors the `release` job in
  # nemtus/symbol-product's publish-shoestring.yaml and the `tag` job in nemtus/symbol's
  # publish workflows; here the tag already exists — it is what triggered the run — so
  # this only creates the Release for it, it never creates or moves a tag.
  #
  # SECURITY: `contents: write` is isolated to THIS job, which runs no build and no
  # third-party code — only the `gh` CLI against the GitHub API. There is deliberately no
  # checkout step, so nothing from the repo tree executes here either. `build` and the
  # other jobs stay at `contents: read`, and `publish` adds only `id-token: write`, so a
  # supply-chain compromise anywhere in the npm build can never reach this write token.
  release:
    needs: publish # runs only after the npm-production approval AND a successful publish
    # A manual workflow_dispatch from a branch has no version tag to release. Dispatching
    # on a tag ref does produce one, and the step below is idempotent, so that still works.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release for the published tag
        # This job does not checkout, so override the workflow-default working-directory
        # (clients/typescript-fetch), which would not exist here.
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          # Tag shape is `<generator>-vX.Y.Z` (owned by scripts/release.mjs). Grouping on
          # this exact prefix is also what keeps `typescript-fetch-legacy-v*` — the
          # pre-monorepo v0.x history — out of the "previous release" lookup.
          TAG_PREFIX: typescript-fetch-v
          PKG: '@nemtus/symbol-rest-api-client-fetch'
        run: |
          set -euo pipefail
          version="${TAG#"${TAG_PREFIX}"}"
          if [ "${version}" = "${TAG}" ]; then
            echo "::error::tag '${TAG}' does not start with '${TAG_PREFIX}'; refusing to guess a version." >&2
            exit 1
          fi

          # Idempotent: re-running a published tag (or dispatching on one) must not fail.
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "release ${TAG} already exists; nothing to do."
            exit 0
          fi

          # Previous version of THIS client, resolved from TAGS — not from Releases.
          #
          # Both clients live in one repo and advance on independent PATCH lanes, so the
          # newest release overall is often the OTHER one; scoping per client is the whole
          # point of this block. Tags are the authoritative coordinate for that:
          # scripts/release.mjs pushes them, and Releases only started existing at 1.0.2.
          # Scoping on Releases therefore came up EMPTY on its first ever run, which
          # silently handed the choice back to GitHub — and GitHub defaults to the
          # chronologically previous tag. That is exactly how typescript-axios-v1.0.2's
          # notes were generated against `typescript-fetch-v1.0.2`: the sibling client,
          # tagged 16 seconds earlier. It must not be possible to fall out of the scoping
          # while a same-client predecessor exists.
          #
          # `^${TAG_PREFIX}[0-9]` also keeps the pre-monorepo `*-legacy-v*` tags out: they
          # read `typescript-<gen>-legacy-v…`, which never matches `typescript-<gen>-v<digit>`.
          # `sort -V | tail -n1`, not `head -n1`: the refs API returns tags alphabetically,
          # where `v1.0.10` sorts BEFORE `v1.0.2`.
          prev="$(gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags" --paginate --jq '.[].ref' 2>/dev/null \
            | sed 's|^refs/tags/||' \
            | grep -E "^${TAG_PREFIX}[0-9]" \
            | grep -vxF "${TAG}" \
            | sort -V | tail -n1 || true)"
          echo "previous ${PKG} version: ${prev:-<none>}"

          # The spec version this client targets, read through the API at the released
          # tag. Deliberately not via checkout: this job stays code-free. Best-effort —
          # a missing or unreadable field just drops the clause.
          spec="$(gh api "repos/${GITHUB_REPOSITORY}/contents/clients/typescript-fetch/package.json?ref=${TAG}" \
            --jq '.content' 2>/dev/null | base64 -d 2>/dev/null \
            | jq -r '.symbolOpenapiVersion // empty' 2>/dev/null || true)"

          provenance="Published [\`${PKG}\` ${version}](https://www.npmjs.com/package/${PKG}/v/${version}) to npm via OIDC Trusted Publishing (provenance attached)."
          if [ -n "${spec}" ]; then
            provenance="${provenance} Generated from the [\`@nemtus/symbol-openapi\`](https://www.npmjs.com/package/@nemtus/symbol-openapi) spec ${spec}."
          fi

          if notes="$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="${TAG}" -f target_commitish="${GITHUB_SHA}" \
              ${prev:+-f previous_tag_name="${prev}"} -q '.body' 2>/dev/null)" && [ -n "${notes}" ]; then
            body="$(printf '%s\n\n%s\n' "${provenance}" "${notes}")"
          else
            echo "note: could not generate release notes; publishing the provenance line only."
            body="${provenance}"
          fi

          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${PKG} v${version} · npm" \
            --notes "${body}"
